<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Another item</title>
</head>
<body>
  <form>
    <label for="date">Pick a date:</label>
    <input type="date" name="date" id="date">
    <input type="checkbox" name="coffee" id="coffee" value="Coffee">
    <label for="coffee">Coffee</label>
    <input type="checkbox" name="milk" id="milk" value="Milk">
    <label for="milk">Milk</label>
    <p>Specify age range:</p>
    <input type="radio" name="age" id="agekid" value="agekid">
    <label for="agekid">> 13</label>
    <input type="radio" name="age" id="ageadults" value="ageadults">
    <label for="ageadults">13 > < 67</label>
    <input type="radio" name="age" id="ageretirees" value="ageretirees">
    <label for="ageretirees">67 > </label>
    <input type="submit" value="Book a visit">
  </form>
</body>
</html>
